# Short power-key press: blank the panel only.
#
# logind's own power-key actions are all machine-level: "poweroff" shuts the
# tablet down and "suspend" freezes the SoC, which also takes the USB ACM
# gadget (and therefore the ttyGS0 debug console) down with it.  The key is
# handled by gts9-power-key.service instead, which only toggles
# /sys/class/graphics/fb0/blank: the screen goes off, everything else keeps
# running.  A long press still reaches the PMIC's own forced-power-off path.
[Login]
HandlePowerKey=ignore
