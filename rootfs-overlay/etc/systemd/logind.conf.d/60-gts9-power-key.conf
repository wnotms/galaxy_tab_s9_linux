# Short power-key press: backlight off, system keeps running.
#
# logind's own power-key actions are all machine-level: "poweroff" shuts the
# tablet down and "suspend" freezes the SoC, which also takes the USB ACM
# gadget (and therefore the ttyGS0 debug console) down with it.  There is no
# "blank" action to ask for: logind 257 rejects HandlePowerKey=blank with
# "Failed to parse ..., ignoring: Invalid argument" and then silently uses its
# poweroff default, so a short press would shut the tablet down.
#
# The key is handled by gts9-power-key.service instead.  Short press: the
# daemon writes the panel backlight (bl_power/brightness), which is a single
# DSI brightness command - not a DPU modeset, and not /sys/class/graphics/fb0/blank.
# Long press (>= 1.2 s): the daemon does nothing, so the PMIC's own
# forced-power-off path stays in charge.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
